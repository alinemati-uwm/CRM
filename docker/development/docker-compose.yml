services:
  ################################################################################
  # Docker Compose file for the CRM project with SearxNG and PostgreSQL
  ################################################################################
  crm_web:
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    container_name: crm_dev
    restart: unless-stopped
    volumes:
      - ../../:/app
      - ../../static:/app/static
      - ../../media:/app/crm/media
    env_file:
      - ../../.env
    ports:
      - "9090:8000"
    command: >
      sh -c "
        # python manage.py wait_for_db &&
        echo 'Waiting for database to be ready...' &&
        # A wait-for-it script or similar logic is recommended here
        python manage.py makemigrations &&
        echo 'Database ready. Running migrations...' &&
        python manage.py migrate &&
        echo 'Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo 'Migrations and collectstatic complete. Starting server...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    depends_on:
      crm_db:
        condition: service_healthy


    networks:
      crm-network:
        aliases:
          - crm

  ################################################################################
  # crm_db - PostgreSQL database for the CRM project
  ################################################################################
  crm_db:
    image: postgres:17.4-alpine
    container_name: crm_db_dev
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5436:5432"
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm-network
  
networks:
  crm-network:
    driver: bridge
  
volumes:
  postgres_data: